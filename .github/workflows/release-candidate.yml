name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TZ: Asia/Shanghai

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.2"
      - name: Build and smoke each candidate platform
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            docker buildx build --load --platform "linux/$architecture" --tag "rubidium:preflight-$architecture" \
              --secret id=HEROUI_KEY,env=HEROUI_KEY \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.licenses=AGPL-3.0-only" .
            BARKER_SMOKE_PLATFORM="linux/$architecture" node scripts/container-smoke.mjs "rubidium:preflight-$architecture"
          done
