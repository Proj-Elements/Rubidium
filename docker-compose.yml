services:
  rubidium:
    build:
      context: .
      secrets:
        - HEROUI_KEY
    image: rubidium:local
    container_name: rubidium
    ports:
      - "${RUBIDIUM_BIND_ADDR:-127.0.0.1}:${RUBIDIUM_PORT:-3000}:3000"
    environment:
      RUBIDIUM_PASSWORD: ${RUBIDIUM_PASSWORD:-}
      RUBIDIUM_SETUP_TOKEN: ${RUBIDIUM_SETUP_TOKEN:-}
      RUBIDIUM_ALLOW_SETUP: ${RUBIDIUM_ALLOW_SETUP:-}
      RUBIDIUM_SESSION_SECRET: ${RUBIDIUM_SESSION_SECRET:-}
      TZ: Asia/Shanghai
      RUBIDIUM_DATA_DIR: ${RUBIDIUM_DATA_DIR:-/app/data}
      RUBIDIUM_TRUST_PROXY: ${RUBIDIUM_TRUST_PROXY:-}
      RUBIDIUM_COOKIE_SECURE: ${RUBIDIUM_COOKIE_SECURE:-}
    volumes:
      - barker-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

volumes:
  barker-data:

secrets:
  HEROUI_KEY:
    environment: HEROUI_KEY
