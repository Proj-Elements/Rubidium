services:
  rubidium:
    build:
      context: .
      secrets:
        - HEROUI_KEY
    image: rubidium:local
    container_name: rubidium
    ports:
      - "${BARKER_BIND_ADDR:-127.0.0.1}:${BARKER_PORT:-3000}:3000"
    environment:
      BARKER_PASSWORD: ${BARKER_PASSWORD:-}
      BARKER_SETUP_TOKEN: ${BARKER_SETUP_TOKEN:-}
      BARKER_ALLOW_SETUP: ${BARKER_ALLOW_SETUP:-}
      BARKER_SESSION_SECRET: ${BARKER_SESSION_SECRET:-}
      TZ: Asia/Shanghai
      BARKER_DATA_DIR: ${BARKER_DATA_DIR:-/app/data}
      BARKER_TRUST_PROXY: ${BARKER_TRUST_PROXY:-}
      BARKER_COOKIE_SECURE: ${BARKER_COOKIE_SECURE:-}
    volumes:
      - barker-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

volumes:
  barker-data:

secrets:
  HEROUI_KEY:
    environment: HEROUI_KEY
